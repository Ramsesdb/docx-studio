services:
  backend:
    build: ./backend
    container_name: docxstudio-backend
    ports:
      - "8000:8000"
    environment:
      - NEXUS_GATEWAY_URL=${NEXUS_GATEWAY_URL}
      - NEXUS_API_KEY=${NEXUS_API_KEY}
    volumes:
      - docx-temp:/app/temp
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docx-api.rule=Host(`docx.ramsesdb.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.docx-api.entrypoints=websecure"
      - "traefik.http.routers.docx-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.docx-api.loadbalancer.server.port=8000"

  frontend:
    build: ./frontend
    container_name: docxstudio-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docx-web.rule=Host(`docx.ramsesdb.tech`)"
      - "traefik.http.routers.docx-web.entrypoints=websecure"
      - "traefik.http.routers.docx-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.docx-web.loadbalancer.server.port=3000"

volumes:
  docx-temp:
