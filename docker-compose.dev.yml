services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NEXUS_GATEWAY_URL=${NEXUS_GATEWAY_URL:-https://api.ramsesdb.tech}
      - NEXUS_API_KEY=${NEXUS_API_KEY:-}
    volumes:
      - ./backend:/app
      - docx-temp:/app/temp
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

volumes:
  docx-temp:
