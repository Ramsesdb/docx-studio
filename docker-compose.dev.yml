version: '3.8'

# Development docker-compose - use this for local testing
# Usage: docker-compose -f docker-compose.dev.yml up --build

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NEXUS_GATEWAY_URL=${NEXUS_GATEWAY_URL:-https://api.ramsesdb.tech}
      - NEXUS_API_KEY=${NEXUS_API_KEY:-}
